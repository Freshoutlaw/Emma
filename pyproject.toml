[project]
name = "emma-ai"
version = "0.1.0"
description = "Emma — a self-improving, autonomous AI assistant with full system access."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emma Project" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "groq==1.6.0",  # pinned: tested version
    "paho-mqtt>=2.0",
    "cryptography>=42",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "aiofiles==25.1.0",  # pinned: tested version
    "orjson>=3.9.10",
]

[project.optional-dependencies]
voice = ["vosk>=0.3.45", "edge-tts>=6.1", "sounddevice>=0.4.6", "numpy>=1.26"]
vision = ["mediapipe>=0.10", "opencv-python>=4.9", "numpy>=1.26"]
browser = ["playwright>=1.44"]
desktop = ["pyautogui>=0.9.54"]
dev = ["ruff>=0.4", "pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "agents*", "capabilities*", "security*", "memory*", "llm*", "interfaces*", "flags*"]

[tool.setuptools.package-data]
"interfaces.hud" = ["*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
